# Local Postgres for development: `npm run db:up` (waits until healthy).
# The full stack that RepoRun deploys is in docker-compose.yml.
name: affix-dev
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affix
      POSTGRES_PASSWORD: affix
      POSTGRES_DB: affix
    ports:
      - "5432:5432"
    volumes:
      - affix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affix -d affix"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  affix-pgdata:
