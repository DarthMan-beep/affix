# The whole Affix stack, as RepoRun runs it (`docker compose up -d --build`).
# stack.yml exposes the web service. For local development use
# docker-compose.dev.yml (`npm run db:up`) and `npm run dev` instead.
#
# RepoRun requires cpus and mem_limit on every service (their totals must fit
# the team's quota) and does not allow restart policies, named volumes or build
# targets, so the database keeps its files in .data/ inside the checkout.
# Measured peaks under load: web about 230 MB, db about 60 MB.
#
# Values to set under Environment on the RepoRun stack page:
#   POSTGRES_PASSWORD   letters and digits only (it goes into a URL)
#   BETTER_AUTH_SECRET  a long random string
#   BETTER_AUTH_URL     the endpoint URL, e.g. https://affix.example.edu
#   SEED_DEMO_DATA      optional; "false" skips the demo accounts and sales
services:
  db:
    image: postgres:17-alpine
    cpus: 0.1
    mem_limit: 256m
    environment:
      POSTGRES_USER: affix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: affix
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affix -d affix"]
      interval: 3s
      timeout: 3s
      retries: 20
      # The first start creates the database, which is slow on a small CPU share.
      start_period: 120s

  # Applies pending migrations and adds the demo data before the server
  # starts (see the Dockerfile); both steps leave existing data alone.
  web:
    build: .
    cpus: 0.4
    mem_limit: 512m
    environment:
      DATABASE_URL: postgres://affix:${POSTGRES_PASSWORD}@db:5432/affix
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/auth/ok"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
