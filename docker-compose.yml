# The whole Affix stack, as RepoRun runs it (`docker compose up -d --build`).
# stack.yml exposes the web service. For local development use
# docker-compose.dev.yml (`npm run db:up`) and `npm run dev` instead.
#
# Values to set under Environment on the RepoRun stack page:
#   POSTGRES_PASSWORD   letters and digits only (it goes into a URL)
#   BETTER_AUTH_SECRET  a long random string
#   BETTER_AUTH_URL     the endpoint URL, e.g. https://affix.example.edu
#   SEED_DEMO_DATA      optional; "false" skips the demo accounts and sales
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: affix
    volumes:
      - affix-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affix -d affix"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Applies pending migrations, then adds the demo data, and exits. Runs on
  # every start; both steps leave existing data alone.
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://affix:${POSTGRES_PASSWORD}@db:5432/affix
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://affix:${POSTGRES_PASSWORD}@db:5432/affix
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/auth/ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  affix-pgdata:
